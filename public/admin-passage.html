<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文章管理</title>
   <link rel="icon" href="title.png" type="image/png">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h1>文章管理</h1>
    </header>
    <section class="admin-card">
      <h2>编辑文章</h2>
      <div class="form-group">
        <input id="title" placeholder="文章标题">
      </div>
      <div class="form-group">
        <input id="cover" placeholder="封面图片 URL">
      </div>
      <div class="form-group">
        <textarea id="content" placeholder="在此输入 Markdown 正文内容..."></textarea>
      </div>
      <div class="form-group">
        <input id="password" type="password" placeholder="请输入管理员密码进行操作">
      </div>
      <div class="btn-group">
        <button id="submit" class="btn-primary">发布文章</button>
        <button id="update" class="btn-warning">修改文章</button>
        <button id="delete" class="btn-danger">删除文章</button>
      </div>
    </section>
    <section class="admin-card">
      <h2>文章列表</h2>
      <ul id="articleList"></ul>
    </section>
  </div>
  <script type="module" src="./js/admin-passage.js"></script>
</body>
</html>
